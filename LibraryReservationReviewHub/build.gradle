plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.comp5619'
version = '0.0.1-SNAPSHOT'
description = 'LibraryReservationReviewHub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // mysql
    implementation 'com.mysql:mysql-connector-j'
    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // mybatis-plus
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.14'
    // https://mvnrepository.com/artifact/com.baomidou/mybatis-plus-jsqlparser
    implementation("com.baomidou:mybatis-plus-jsqlparser:3.5.14")
    // knife4j
    implementation("com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.4.0")
    // Hutool 工具库 https://doc.hutool.cn/pages/index/
    implementation 'cn.hutool:hutool-all:5.8.26'
    
    // H2数据库支持 (开发环境)
    runtimeOnly 'com.h2database:h2'
    
    // Spring Security (用户认证和权限控制)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // JWT Token支持
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    // 数据验证
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // 邮件发送 (等待列表通知)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // 定时任务 (通知处理)
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
}

tasks.named('test') {
    useJUnitPlatform()
}
