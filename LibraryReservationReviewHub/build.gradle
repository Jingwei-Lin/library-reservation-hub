plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.elec5619'
version = '0.0.1-SNAPSHOT'
description = 'LibraryReservationReviewHub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Testcontainers 1.21.3, which Spring Boot 3.5.5 manages, speaks a Docker API that Docker Engine 29 no longer
// accepts; 1.21.4 is the patch release that fixes it
ext['testcontainers.version'] = '1.21.4'

dependencyManagement {
    imports {
        // Alibaba AI BOM
        mavenBom "com.alibaba.cloud.ai:spring-ai-alibaba-bom:1.0.0.2"
        // Spring AI BOM
        mavenBom "org.springframework.ai:spring-ai-bom:1.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // mysql
    implementation 'com.mysql:mysql-connector-j'
    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Lombok in the tests too
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // mybatis-plus
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.14'
    // https://mvnrepository.com/artifact/com.baomidou/mybatis-plus-jsqlparser
    implementation("com.baomidou:mybatis-plus-jsqlparser:3.5.14")
    // knife4j
    implementation("com.github.xingfudeshi:knife4j-openapi3-jakarta-spring-boot-starter:4.6.0")
    // Hutool utilities https://doc.hutool.cn/pages/index/
    implementation 'cn.hutool:hutool-all:5.8.26'
    
    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // BCrypt password hashing only (no Spring Security filters or auto-configuration)
    implementation 'org.springframework.security:spring-security-crypto'

    // Alibaba DashScope: the chat model
    implementation "com.alibaba.cloud.ai:spring-ai-alibaba-starter-dashscope"
    // Spring AI (versions from the BOM)
    // (the unused Ollama model and MCP client/server starters were removed: the MCP server exposed
    // an endpoint nothing used, and Ollama added a second ChatModel)
    // Kryo: writes the chat memory to files
    implementation 'com.esotericsoftware:kryo:5.6.2'

    // test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // the integration tests' MySQL (support/TestDatabase); the version comes from the Spring Boot BOM
    testImplementation 'org.testcontainers:mysql'
}

/* --------------------------------------------------------------
   JACOCO CONFIGURATION
   -------------------------------------------------------------- */
jacoco {
    toolVersion = "0.8.12"               // latest stable
}

// classes the coverage figures leave out: the entry point, configuration, DTOs/VOs, exceptions, common/
def coverageExcludes = [
        '**/LibraryReservationReviewHubApplication*',
        '**/*Config*',
        '**/*Dto*',
        '**/*Vo*',
        '**/*Exception*',
        '**/common/**'
]

jacocoTestReport {
    dependsOn test                       // run tests first

    reports {
        html.required = true             // open in browser
        xml.required  = true             // for CI / SonarQube
        csv.required  = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludes)
        }))
    }
}

// a floor for line coverage over the same classes; CI runs it, so a change that drops coverage below it fails
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = (project.findProperty('coverageMinimum') ?: '0.90') as BigDecimal
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludes)
        }))
    }
}


tasks.named('test') {
    useJUnitPlatform()
    // the schema the test MySQL is created from
    systemProperty 'testDatabase.schema', file('Schema.sql').absolutePath
    inputs.file('Schema.sql')
    finalizedBy jacocoTestReport
}
