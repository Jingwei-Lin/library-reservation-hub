# One-command local run: docker compose up --build, then open http://localhost:8080
services:
  db:
    image: mysql:8.4
    # the schema uses Book/Users while the queries use book/users; Windows MySQL ignores case, Linux does not
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-library}
    volumes:
      - ./LibraryReservationReviewHub/Schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./LibraryReservationReviewHub
    environment:
      DB_URL: jdbc:mysql://db:3306/library_reservation
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-library}
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      # the app needs a non-empty value to start; set a real key in .env to use the AI assistant
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-not-set}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8432:8432"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
