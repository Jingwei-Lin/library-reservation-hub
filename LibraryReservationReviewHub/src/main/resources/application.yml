server:
    port: 8432
    servlet:
        context-path: /api


spring:
    application:
        name: LibraryReservationReviewHub

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/library_reservation_review_hub
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

# springdoc-openapi项目配置
springdoc:
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha
    api-docs:
        path: /v3/api-docs
    group-configs:
        - group: 'default'
          paths-to-match: '/**'
          packages-to-scan: com/comp5619/libraryreservationreviewhub/controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
    enable: true
    setting:
        language: zh_cn