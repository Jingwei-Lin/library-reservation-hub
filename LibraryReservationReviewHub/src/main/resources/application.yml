server:
  port: 8432
  servlet:
    context-path: /api


spring:
  application:
    name: LibraryReservationReviewHub


  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/library_reservation}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}


# springdoc / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.elec5619.libraryreservationreviewhub.controller
# Knife4j UI on top of springdoc
knife4j:
  enable: true
  setting:
    language: en

mybatis-plus:
  configuration:
    # MyBatis configuration
    map-underscore-to-camel-case: true
    # SQL goes through SLF4J: set logging.level.com.elec5619.libraryreservationreviewhub.mapper=DEBUG to see it
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# INFO by default. For local debugging, override with environment variables, e.g.
# LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG or LOGGING_LEVEL_COM_ELEC5619_LIBRARYRESERVATIONREVIEWHUB_MAPPER=DEBUG
logging:
  level:
    root: INFO



