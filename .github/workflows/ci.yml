name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back end tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LibraryReservationReviewHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # the integration tests start their own MySQL with Testcontainers
      - name: Run tests with JaCoCo coverage
        run: ./gradlew test jacocoTestReport --no-daemon
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: LibraryReservationReviewHub/build/reports

  frontend:
    name: Front end lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
