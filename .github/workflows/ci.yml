name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (the release is in the comment), so a moved tag can't change what runs.
# Update them by hand.

jobs:
  backend:
    name: Back end tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LibraryReservationReviewHub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the Gradle wrapper jar must be an official release
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # the integration tests start their own MySQL with Testcontainers; the build fails below 90% line coverage
      - name: Run tests with JaCoCo coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-and-coverage-reports
          path: LibraryReservationReviewHub/build/reports

  frontend:
    name: Front end lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
